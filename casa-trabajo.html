<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa Trabajo">
<style>
:root{--green:#1c7c47;--green-d:#14633a;--green-l:#e6f4ea;--navy:#12303f;--ink:#13232b;--muted:#667880;--line:#e0e9e3;--bg:#f4f8f5;--red:#c93a3a;--brand:var(--green)}
body.fam{--brand:var(--navy)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#dfe8e2;color:var(--ink);font-size:17px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
input,textarea,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
.ic{display:block;flex:none}
.sp{flex:1}
/* header */
.hd{background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 14px 14px}
.hd h1{margin:0;font-size:21px;font-weight:700}
.hd .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-left:-8px}
.hd .ib:active{background:rgba(255,255,255,.15)}
.hd.big{padding-bottom:46px}
.hd.big h1{font-size:23px}
.hd.big p{margin:2px 0 0;opacity:.9;font-size:15px}
.av{width:56px;height:56px;border-radius:50%;background:#f5d9b8;color:#7a4a1c;display:grid;place-items:center;font-weight:800;font-size:24px;border:3px solid rgba(255,255,255,.7);flex:none}
.pg{padding:14px 14px 110px}
.lift{margin-top:-30px;padding-top:0}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);padding:6px 0;position:relative;text-align:center}
.nav button.on{color:var(--green);font-weight:700}
.dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(20,40,30,.05);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:17px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hint{color:var(--muted);font-size:14px;margin:8px 2px}
.err{color:var(--red);font-weight:600;margin:8px 0}
.row{display:flex;align-items:center;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;min-height:140px;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:0 1px 3px rgba(20,40,30,.06)}
.tile b{font-size:17px}
.tile span{font-size:13.5px;color:#4b5b61}
.tile .go{margin-top:auto;color:var(--green)}
.tile .em{font-size:36px;line-height:1}
.tile.c{align-items:center;text-align:center}
.tile.c b,.tile.c span{text-align:center}
.thanks{background:var(--green-l);border:1px solid #cfe6d6;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;font-style:italic;font-size:19px;color:var(--green-d);margin-bottom:12px}
.link{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;width:100%}
.link .em{font-size:26px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.link b{display:block}
.link small{color:var(--muted);font-size:13.5px}
.link .ch{margin-left:auto;color:var(--muted)}
/* segmented */
.seg{display:flex;background:#e4ece7;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;text-align:center;padding:11px 6px;border-radius:11px;font-weight:600;color:#42565c}
.seg button.on{background:var(--green);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* tasks */
.tr{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 10px;margin-bottom:8px;min-height:56px}
.cb{width:32px;height:32px;border-radius:9px;border:2px solid #9db3a6;display:grid;place-items:center;color:#fff;flex:none;background:#fff}
.cb.on{background:var(--green);border-color:var(--green)}
.cb .ic{visibility:hidden}.cb.on .ic{visibility:visible}
.tr .tt{flex:1;padding:10px 0;font-size:17.5px}
.tr .tt.done{color:var(--muted);text-decoration:line-through}
.tr .tt small{color:var(--muted);font-size:14px}
.tr .chv{color:#9aa9a1}
h2.sec{font-size:18px;margin:18px 2px 10px}
.wk{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.wk:last-child{border:0}
.wk em{font-style:normal;color:var(--muted)}
.pill{display:flex;justify-content:center;margin:16px 0}
.pill span{display:inline-flex;align-items:center;gap:8px;background:var(--green-l);color:var(--green-d);font-weight:700;padding:12px 22px;border-radius:999px;font-size:17px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--green);color:#fff;font-weight:700;border-radius:14px;padding:15px;font-size:17px;text-align:center;margin-top:10px}
.btn:active{background:var(--green-d)}
.btn.sec{background:#e4ece7;color:var(--green-d)}
.btn.dng{background:#fde8e8;color:var(--red)}
.btn.nv{background:var(--navy)}
.btn.sm{width:auto;padding:10px 16px;font-size:15px;margin-top:0}
.stick{position:sticky;bottom:86px}
/* messages */
.msg{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.msg.me{background:#f2f9f4}
.mav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:#fbe3b4;color:#7a5a12}
.mav.m{background:#f5d9b8;color:#7a4a1c}
.msg .who{font-weight:700;font-size:15px}
.msg .when{color:var(--muted);font-size:13px;font-weight:400}
.msg p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
/* shopping */
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1}
.add button{width:54px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center}
.sh-it{display:flex;align-items:center;gap:12px;padding:6px 2px;border-bottom:1px solid var(--line);min-height:54px}
.sh-it:last-child{border:0}
.sh-it .nm{flex:1;padding:8px 0}
.sh-it .nm.done{text-decoration:line-through;color:var(--muted)}
.x{color:#aab6ae;width:40px;height:40px;display:grid;place-items:center}
/* menu */
.meal{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;width:100%}
.meal .e{font-size:34px;width:54px;height:54px;border-radius:50%;background:#f1f6f2;display:grid;place-items:center;flex:none}
.meal b{font-size:17px}.meal b span{color:var(--muted);font-weight:500;font-size:15px;margin-left:6px}
.meal div div{color:#33464d}
.meal .wh{color:var(--muted);font-size:14px}
.ppl{background:var(--green-l);border-radius:16px;padding:14px}
.ppl h3{margin:0 0 8px;font-size:16px;color:var(--green-d)}
.ppl .p{display:inline-flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:6px 12px;margin:0 6px 6px 0;font-size:15px}
.dayhd{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.dayhd.t{color:var(--green)}
.ml{display:block;width:100%;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.ml em{font-style:normal;color:var(--muted);display:inline-block;min-width:88px}
/* sections */
.it{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;position:relative}
.it .tp{display:flex;gap:12px;align-items:flex-start}
.it .em{font-size:28px;width:46px;height:46px;border-radius:12px;background:#eaf3ed;display:grid;place-items:center;flex:none}
.it b{display:block;font-size:17.5px}
.it .tx{white-space:pre-wrap;color:#33464d;margin-top:4px;word-break:break-word}
.it img{width:100%;border-radius:12px;margin-top:10px;display:block;max-height:260px;object-fit:cover}
.it .ed{position:absolute;top:8px;right:6px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.it .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .em{font-size:40px}
/* forms */
label.l{display:block;font-weight:700;font-size:14.5px;margin:14px 2px 6px}
input.in,textarea.in,select.in{width:100%;border:1.5px solid #cdd9d1;border-radius:12px;padding:12px 14px;background:#fff;font-size:17px;min-height:50px}
textarea.in{min-height:110px;resize:vertical}
input.in:focus,textarea.in:focus,select.in:focus{outline:0;border-color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:10px 0;width:calc((100% - 36px)/7);text-align:center;border-radius:10px;background:#eef3ef;font-weight:700;font-size:14px;color:#42565c}
.chip.on{background:var(--green);color:#fff}
.emos{display:flex;gap:8px;flex-wrap:wrap}
.emo{font-size:24px;width:48px;height:48px;border-radius:12px;background:#eef3ef;display:grid;place-items:center}
.emo.on{background:var(--green-l);outline:2.5px solid var(--green)}
.pv{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:8px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,25,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.shp{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:90vh;max-height:90dvh;overflow:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease-out}
.shp h3{margin:0 0 4px;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#173b2a;color:#fff;padding:12px 18px;border-radius:12px;z-index:40;font-size:15.5px;max-width:86%;text-align:center}
.bnr{background:#fff4d6;color:#6b4e07;padding:10px 14px;font-size:14.5px;border-bottom:1px solid #f0dfa8}
.bnr button{font-weight:700;text-decoration:underline;display:inline}
/* welcome / login */
.ctr{padding:calc(env(safe-area-inset-top) + 26px) 22px 30px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.splash{align-items:center;justify-content:center;text-align:center;background:linear-gradient(#fbfdf9,#f1f8f1)}
.bigname{font-size:46px;font-weight:900;line-height:1;color:var(--green-d);letter-spacing:1px}
.bigname b{color:var(--navy);display:block}
.tag{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:22px;margin:14px 0 22px;border-bottom:3px solid var(--green-d);padding-bottom:4px;display:inline-block}
.brandrow{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 22px}
.brandrow div{font-weight:900;font-size:30px;line-height:1;color:var(--green-d);text-align:left}
.brandrow div b{color:var(--navy);display:block}
.role{display:flex;gap:16px;align-items:center;border-radius:18px;padding:20px 18px;color:#fff;margin-bottom:16px;width:100%;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.role.g{background:#1f9150}.role.b{background:#2c79c7}
.role .ci{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;font-size:32px}
.role b{font-size:21px;display:block}
.role span{font-size:15px;opacity:.95}
.codein{text-align:center;font-size:34px;letter-spacing:12px;font-weight:700;padding:14px}
.lockn{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);text-align:center;font-size:14.5px;margin-top:auto;padding-top:20px;flex-direction:column}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal u{text-decoration:none;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.day{height:42px;border-radius:10px;background:#f0f5f1;text-align:center;font-weight:600;font-size:15px}
.day.ok{background:#bfe6cb;color:#0e5a2c}.day.falta{background:#f7c9c9;color:#8b1f1f}.day.permiso{background:#fbe3a6;color:#6b4e07}
.day.today{outline:2.5px solid var(--navy)}
.leg{display:flex;gap:12px;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.bigcode{font-size:40px;font-weight:900;letter-spacing:8px;text-align:center;background:#eef6f0;border-radius:14px;padding:14px;color:var(--green-d)}
.pay{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border:0}
.pay b{white-space:nowrap}
.mhd{display:flex;align-items:center;justify-content:space-between;font-weight:700;text-transform:capitalize}
.mhd button{width:44px;height:40px;display:grid;place-items:center;border-radius:10px;background:#eef3ef}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
(()=>{
'use strict';
/* ============ CONFIGURACIÓN ============
   Si ya tenés la dirección de tu Firebase, podés pegarla aquí abajo
   (o ponerla desde la app: Ajustes > Conexión). Ejemplo:
   const FIREBASE_URL='https://mi-proyecto-default-rtdb.firebaseio.com';  */
const FIREBASE_URL='';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={g(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},d(k){try{localStorage.removeItem(k)}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WEEK=[1,2,3,4,5,6,0];
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nice=k=>{const[y,m,d]=k.split('-').map(Number);return `${d} ${MN[m-1].slice(0,3)}.`};
const money=a=>{a=Number(a)||0;const s=a.toFixed(a%1?2:0).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return 'Bs '+s};
const randCode=()=>String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000));

/* ============ INICIONES / URL ============ */
(function(){try{const u=new URL(location.href);const db=u.searchParams.get('db');if(db&&/^https?:\/\/[^\s]+$/.test(db)&&!FIREBASE_URL){LS.s('ct_db',db.replace(/\/+$/,''));}if(u.searchParams.has('db')){u.searchParams.delete('db');history.replaceState({},'',u.pathname+u.search+u.hash)}}catch(e){}})();
const dbBase=()=>(FIREBASE_URL||LS.g('ct_db','')||'').replace(/\/+$/,'');
const remote=()=>!!dbBase();

/* ============ BASE DE DATOS (local o Firebase REST) ============ */
let DB=LS.g(remote()?'ct_cache':'ct_local',{})||{};
let Q=LS.g('ct_queue',[])||[];
let flushing=false;
const ST={screen:'splash',view:'home',params:{},stack:[],online:true,synced:false,rutina:'diaria',menu:'hoy',shop:'limpieza',msg:'ella',mo:0,role:null,err:'',msgTop:''};
let S=LS.g('ct_session',null);
let SH=null;
const persist=()=>LS.s(remote()?'ct_cache':'ct_local',DB);
const saveQ=()=>LS.s('ct_queue',Q);
const get=p=>{let o=DB;for(const k of p.split('/')){if(o==null||typeof o!=='object')return undefined;o=o[k]}return o};
function set(p,v){
  const parts=p.split('/');let o=DB;
  for(let i=0;i<parts.length-1;i++){if(o[parts[i]]==null||typeof o[parts[i]]!=='object')o[parts[i]]={};o=o[parts[i]]}
  const last=parts[parts.length-1];
  if(v===null)delete o[last];else o[last]=v;
  persist();
  if(remote()){Q.push({p,v:v===null?null:JSON.parse(JSON.stringify(v))});saveQ();flush()}
}
const list=(p,desc)=>Object.entries(get(p)||{}).map(([id,v])=>({id,...v})).sort((a,b)=>desc?((b.ts||b.o||0)-(a.ts||a.o||0)):((a.o||0)-(b.o||0)));
const url=p=>`${dbBase()}/casa${p?'/'+p:''}.json`;
function fetchT(u,o={},ms=8000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))}
async function flush(){
  if(flushing||!remote())return;flushing=true;
  try{
    while(Q.length){const w=Q[0];const r=await fetchT(url(w.p),{method:w.v===null?'DELETE':'PUT',body:w.v===null?undefined:JSON.stringify(w.v)});if(!r.ok)throw new Error('http');Q.shift();saveQ()}
    ST.online=true;
  }catch(e){ST.online=false}
  finally{flushing=false;softRender()}
}
async function pull(){
  if(!remote()||Q.length||flushing)return;
  try{
    const r=await fetchT(url(''));if(!r.ok)throw new Error('http');
    const d=await r.json();ST.online=true;ST.synced=true;
    if(JSON.stringify(d||{})!==JSON.stringify(DB)){DB=d||{};persist();checkSession();softRender()}
    else if(ST.screen==='app'&&!ST.wasOnline){softRender()}
    ST.wasOnline=true;
  }catch(e){ST.online=false;ST.wasOnline=false;softRender()}
}
function checkSession(){
  if(!S||!ST.synced&&remote())return;
  const c=DB.config;
  if(!c||(S.role==='family'?S.code!==c.familyCode:S.code!==c.maidCode)){
    const was=S.role;S=null;LS.d('ct_session');ST.screen='chooser';ST.stack=[];ST.view='home';
    ST.err=was==='maid'?'El código cambió. Pide el código nuevo a la familia.':'El código de la familia cambió. Entra con el código nuevo.';
    render();
  }
}

/* ============ ICONOS ============ */
const IC={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/>',
chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/>',
chef:'<path d="M7 14a4 4 0 1 1 1.5-7.7A4 4 0 0 1 16 6a4 4 0 0 1 1 8v5H7z"/><path d="M7 17h10"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12l5 5 9-10" stroke-width="3"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.7"/><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"/>',
smile:'<circle cx="12" cy="12" r="9.5"/><path d="M8 14c1 1.8 2.4 2.6 4 2.6s3-.8 4-2.6"/><path d="M9 9.5v.5M15 9.5v.5"/>'
};
const ic=(n,s=24,extra='')=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${IC[n]}</svg>`;
const logo=(c='#14633a',w=150)=>`<svg width="${w}" viewBox="0 0 200 180" aria-hidden="true"><g fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M44 88 L112 30 L180 88"/><path d="M150 52 V28 H166 V68"/></g><g fill="${c}"><rect x="99" y="62" width="11" height="11" rx="2"/><rect x="114" y="62" width="11" height="11" rx="2"/><rect x="99" y="77" width="11" height="11" rx="2"/><rect x="114" y="77" width="11" height="11" rx="2"/></g><path d="M150 118 C128 102 132 84 143 84 C148 84 150 88 150 90 C150 88 152 84 157 84 C168 84 172 102 150 118Z" fill="#e2312f"/><g stroke="${c}" stroke-linecap="round" fill="none"><path d="M66 54 L46 124" stroke-width="8"/></g><path d="M34 124 L62 132 L56 168 L18 156 Z" fill="${c}"/><path d="M30 138 L52 145M27 148 L48 155" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M70 160 Q120 138 186 160" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;

/* ============ TOAST / SHEET ============ */
let tt;function toast(m){const t=$('#toast');t.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>t.innerHTML='',2600)}
function openSheet(o){
  SH=Object.assign({fields:[],vals:{},saveLabel:'Guardar',html:''},o);
  const fl=SH.fields.map(f=>{
    const v=SH.vals[f.k]!=null?SH.vals[f.k]:(f.d!=null?f.d:'');
    let inp='';
    if(f.t==='area')inp=`<textarea class="in" data-f="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else if(f.t==='select')inp=`<select class="in" data-f="${f.k}">${f.o.map(([a,b])=>`<option value="${a}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
    else if(f.t==='days'){const cur=String(v||'');inp=`<div class="chips" data-f="${f.k}">${WEEK.map(d=>`<button type="button" class="chip ${cur.includes(d)?'on':''}" data-act="chip" data-v="${d}">${DS[d].slice(0,2)}</button>`).join('')}</div>`}
    else if(f.t==='emoji'){const cur=v||f.o[0];inp=`<div class="emos" data-f="${f.k}">${f.o.map(e=>`<button type="button" class="emo ${e===cur?'on':''}" data-act="emo" data-v="${e}">${e}</button>`).join('')}</div>`}
    else if(f.t==='photo'){SH.photo=v||'';inp=`<input type="file" accept="image/*" data-photo><div id="pvbox">${v?`<img class="pv" src="${v}" alt="">`:''}</div>${v?'<button type="button" class="btn sec sm" style="margin-top:8px" data-act="rmphoto">Quitar foto</button>':''}`}
    else inp=`<input class="in" data-f="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal"':''} ${f.t==='tel'?'inputmode="tel"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
    return `<label class="l">${esc(f.l)}</label>${inp}`;
  }).join('');
  $('#sheet').innerHTML=`<div class="ov" data-act="shclose"><div class="shp"><h3>${esc(SH.title)}</h3>${SH.note?`<p class="hint" style="margin-top:2px">${SH.note}</p>`:''}${SH.html||''}${fl}${SH.onSave?`<button class="btn" data-act="shsave">${esc(SH.saveLabel)}</button>`:''}${SH.onDelete?`<button class="btn dng" data-act="shdel">${esc(SH.delLabel||'Eliminar')}</button>`:''}<button class="btn sec" data-act="shclose2">${SH.onSave||SH.onDelete?'Cancelar':'Cerrar'}</button></div></div>`;
  setTimeout(()=>{const i=$('#sheet input.in,#sheet textarea.in');if(i&&!('ontouchstart' in window))i.focus()},50);
}
function closeSheet(){$('#sheet').innerHTML='';SH=null;if(ST.dirty){ST.dirty=false;render()}}
function collect(){
  const v={};
  SH.fields.forEach(f=>{
    const el=$(`#sheet [data-f="${f.k}"]`);
    if(f.t==='days')v[f.k]=[...document.querySelectorAll(`#sheet [data-f="${f.k}"] .chip.on`)].map(c=>c.dataset.v).sort().join('');
    else if(f.t==='emoji'){const e=$(`#sheet [data-f="${f.k}"] .emo.on`);v[f.k]=e?e.dataset.v:''}
    else if(f.t==='photo')v[f.k]=SH.photo||'';
    else v[f.k]=el?el.value.trim():'';
  });return v;
}
function ask(title,msg,yes,fn,danger=true){openSheet({title,html:`<p>${msg}</p>`,saveLabel:yes,onSave:()=>{closeSheet();fn()},danger})}
function compress(file,max=900,q=.62){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>res('');im.src=r.result};r.readAsDataURL(file)})}

/* ============ NAVEGACIÓN ============ */
function go(v,p){ST.stack.push({v:ST.view,p:ST.params});ST.view=v;ST.params=p||{};history.pushState({},'');render();window.scrollTo(0,0)}
function backNav(){if(ST.stack.length){const t=ST.stack.pop();ST.view=t.v;ST.params=t.p;render();window.scrollTo(0,0)}}
window.addEventListener('popstate',()=>{if(SH){closeSheet();history.pushState({},'');return}if(ST.stack.length)backNav()});
const tabs=()=>S&&S.role==='family'?[['home','Inicio','home'],['rutina','Rutina','cal'],['mensajes','Mensajes','chat'],['mas','Más','menu']]:[['home','Inicio','home'],['rutina','Mi rutina','cal'],['mensajes','Mensajes','chat'],['mas','Más','menu']];
function setTab(t){ST.view=t;ST.params={};ST.stack=[];render();window.scrollTo(0,0)}

/* ============ DATOS DE LA CASA ============ */
const SEC={
guia:{t:'Guía de bienvenida',s:'Reglas, horarios, descansos, días libres',ic:'🏠',bg:'#dcf2e4',add:'Agregar regla o información',f:[{k:'title',l:'Título',ph:'Ej: Horario de entrada y salida',req:1},{k:'text',l:'Detalle',t:'area',ph:'Escribe aquí el detalle'}]},
donde:{t:'Dónde está cada cosa',s:'Llaves, limpieza, medidores, etc.',ic:'🔑',bg:'#fdeec9',add:'Agregar un lugar',f:[{k:'icon',l:'Ícono',t:'emoji',o:['🧹','🧴','🔑','⚡','🚰','📦','🧺','🔌','🧯','🗑️','🔧','📌']},{k:'title',l:'¿Qué es?',ph:'Ej: Escobas y trapeadores',req:1},{k:'place',l:'¿Dónde está?',ph:'Ej: En el cuarto de limpieza'},{k:'photo',l:'Foto (opcional)',t:'photo'}]},
como:{t:'Cómo se hace cada tarea',s:'Instrucciones paso a paso',ic:'📝',bg:'#e6dcf7',add:'Agregar instrucciones',f:[{k:'title',l:'Tarea',ph:'Ej: Cómo usar la lavadora',req:1},{k:'text',l:'Pasos',t:'area',ph:'1. …\n2. …'}]},
cuidados:{t:'Cuidados especiales',s:'Mascotas, alergias, qué no mezclar, etc.',ic:'🐾',bg:'#fddccd',add:'Agregar un cuidado',f:[{k:'title',l:'Tema',ph:'Ej: Nunca mezclar lavandina con…',req:1},{k:'text',l:'Detalle',t:'area'}]},
contactos:{t:'Contactos importantes',s:'Familia, vecinos, servicios, emergencias',ic:'👥',bg:'#d9efd0',add:'Agregar contacto',f:[{k:'title',l:'Nombre',ph:'Ej: Plomero Don Luis',req:1},{k:'role',l:'¿Quién es?',ph:'Ej: Plomero / Vecina / Emergencia'},{k:'phone',l:'Teléfono',t:'tel'},{k:'text',l:'Nota',ph:'Opcional'}]}
};
const MEALS=[['des','Desayuno','07:30','🥣'],['alm','Almuerzo','12:30','🍲'],['mer','Merienda','16:30','🥪'],['cen','Cena','20:00','🍜']];
const isFam=()=>S&&S.role==='family';
const pname=()=>(get('person/name')||'').trim();

function seedAll(code,maidCode,name){
  const t=Date.now();let n=0;
  set('config',{familyCode:code,maidCode,household:'Dante (6 años), Papá, Mamá',created:t});
  set('person',{name:name||'',start:dkey()});

</div>`;
}

function vApp(){
  if(!S)return '';
  const v=ST.view;let body='';
  if(v==='home')body=isFam()?vHomeFam():vHomeMaid();
  else if(v==='rutina')body=vRutina();else if(v==='mensajes')body=vMensajes();else if(v==='mas')body=vMas();
  else if(v==='menu')body=vMenu();else if(v==='compras')body=vCompras();else if(v==='sec')body=vSec();
  else if(v==='admin')body=vAdmin();else if(v==='ajustes')body=vAjustes();
  const un=unread();
  const nav=tabs().map(([k,l,i])=>`<button class="${ST.view===k||(!tabs().some(t=>t[0]===ST.view)&&k===ST.root)?'on':''}" data-act="tab" data-v="${k}">${ic(i,26)}<span>${l}</span>${k==='mensajes'&&un?`<span class="dot">${un}</span>`:''}</button>`).join('');
  return banners()+body+`<nav class="nav">${nav}</nav>`;
}

function render(){
  document.body.className=S&&S.role==='family'?'fam':'mai';
  document.querySelector('meta[name=theme-color]').content=ST.screen==='app'&&S&&S.role==='family'?'#12303f':'#1c7c47';
  const sc=ST.screen;
  $('#app').innerHTML=sc==='splash'?vSplash():sc==='chooser'?vChooser():sc==='code'?vCode():sc==='setup'?vSetup():vApp();
  if(sc==='code'||sc==='setup'){const i=$('#app input');if(i&&!('ontouchstart' in window))i.focus()}
}
function softRender(){
  if(SH){ST.dirty=true;return}
  const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA/.test(a.tagName)){ST.dirty=true;return}
  render();
}

/* ============ ACCESO ============ */
function enter(role,code){
  S={role,code};LS.s('ct_session',S);ST.screen='app';ST.view='home';ST.stack=[];ST.params={};ST.err='';ST.root='home';
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();pull();
}
async function tryLogin(role,code){
  const fails=LS.g('ct_fail',{n:0,t:0});
  if(fails.n>=5&&Date.now()-fails.t<60000){ST.err='Demasiados intentos. Espera un minuto.';return render()}
  ST.busy=true;ST.err='';render();
  if(remote()){try{const r=await fetchT(url(''));if(r.ok){const d=await r.json();DB=d||{};ST.synced=true;ST.online=true;persist()}}catch(e){ST.online=false}}
  ST.busy=false;
  const c=DB.config;
  if(!c){
    if(role==='family'){ST.screen='setup';ST.err='';return render()}
    ST.err=remote()&&!ST.online?'No hay conexión a internet.':'La familia todavía no configuró la app.';return render();
  }
  const ok=role==='family'?code===c.familyCode:code===c.maidCode;
  if(ok){LS.d('ct_fail');return enter(role,code)}
  LS.s('ct_fail',{n:(fails.t&&Date.now()-fails.t<60000?fails.n:0)+1,t:Date.now()});
  ST.err='Código incorrecto. Intenta otra vez.';render();
}

/* ============ ACCIONES ============ */

tochooser(){ST.screen='chooser';ST.err='';render()},
back(){history.back()},
tab(el){ST.root=el.dataset.v;setTab(el.dataset.v)},
go(el){go(el.dataset.v)},
goto(el){go(el.dataset.v)},
sec(el){go('sec',{k:el.dataset.v})},
seg(el){ST[el.dataset.k]=el.dataset.v;render()},
gear(){openSheet({title:'Tu app',html:`<p class="small">${remote()?(ST.online?'✅ Conectada.':'⚠️ Sin conexión ahora.'):''}</p>${installBox()||'<p class="small">✅ La app ya está instalada.</p>'}`})},

mo(el){ST.mo+=Number(el.dataset.v);render()},
chip(el){el.classList.toggle('on')},
emo(el){el.parentNode.querySelectorAll('.emo').forEach(e=>e.classList.remove('on'));el.classList.add('on')},
rmphoto(){SH.photo='';$('#pvbox').innerHTML='';},
shclose(el,e){if(e.target===el)closeSheet()},
shclose2(){closeSheet()},
shsave(){const v=collect();for(const f of SH.fields)if(f.req&&!v[f.k]){toast('Falta: '+f.l);return}const fn=SH.onSave;fn(v)},
shdel(){const fn=SH.onDelete;fn()},

task(el){

},
tocomo(){closeSheet();go('sec',{k:'como'})},
addtask(){editTask()},
newmsg(){
  openSheet({title:isFam()?'Mensaje para '+(pname()||'ella'):'Mensaje para la familia',fields:[{k:'text',l:'Escribe tu mensaje',t:'area',req:1}],saveLabel:'Enviar',onSave:v=>{set('msgs/'+uid(),{from:isFam()?'familia':'maid',text:v.text,ts:Date.now()});ST.msg=isFam()?'ella':'deella';closeSheet();render();toast('Mensaje enviado')}});

delmsg(el){ask('¿Borrar mensaje?','Se borrará para todos.','Borrar',()=>{set('msgs/'+el.dataset.id,null);render()})},
meal(el){

people(el){

shopdel(el){set('shop/'+el.dataset.id,null);render()},

addsec(el){editSec(el.dataset.v)},

editperson(){

},
newmaidcode(){
  openSheet({title:'Nuevo código de acceso',note:'Al guardar, el celular que tenga el código anterior se desconecta y deberá poner el nuevo.',fields:[{k:'code',l:'Código (4 a 8 números)',t:'tel',req:1}],vals:{code:randCode()},saveLabel:'Guardar código nuevo',onSave:v=>{if(!/^\d{4,8}$/.test(v.code)){toast('Usa de 4 a 8 números');return}set('config/maidCode',v.code);closeSheet();render();toast('Código cambiado')}});
},
newfamcode(){

},
sharecode(){
  const c=get('config/maidCode'),n=pname();

day(el){
  const k=el.dataset.id;openSheet({title:nice(k)+' · asistencia',html:`<button class="btn" data-act="setday" data-id="${k}" data-v="ok">Asistió</button><button class="btn sec" data-act="setday" data-id="${k}" data-v="permiso">Permiso</button><button class="btn dng" data-act="setday" data-id="${k}" data-v="falta">Faltó</button><button class="btn sec" data-act="setday" data-id="${k}" data-v="">Borrar marca</button>`});
},
setday(el){set('asist/'+el.dataset.id,el.dataset.v||null);closeSheet();render()},
addpay(){editPay()},editpay(el){editPay(el.dataset.id)},
newperson(){
  openSheet({title:'Cambiar de persona',note:'La persona anterior se guarda en el historial y se crea un código nuevo.',fields:[{k:'name',l:'Nombre de la nueva persona (opcional)'}],saveLabel:'Cambiar',onSave:v=>{
    const old=get('person')||{};
    set('hist/'+uid(),{name:old.name||'',start:old.start||'',end:dkey(),ts:Date.now()});
    ['pagos','asist','checks','msgs'].forEach(k=>set(k,null));
    set('person',{name:v.name,start:dkey()});
    set('config/maidCode',randCode());
    closeSheet();render();toast('Listo. Código nuevo creado.');
  }});
},
async connect(){
  let u=($('#dburl').value||'').trim().replace(/\/+$/,'');
  if(!/^https:\/\/.+/.test(u)){toast('La dirección debe empezar con https://');return}
  toast('Probando conexión…');
  try{
    const r=await fetchT(u+'/casa.json');
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    if(!d){const loc=LS.g('ct_local',{});if(loc&&Object.keys(loc).length){const w=await fetchT(u+'/casa.json',{method:'PUT',body:JSON.stringify(loc)});if(!w.ok)throw new Error('w')}}
    LS.s('ct_db',u);LS.d('ct_cache');LS.s('ct_queue',[]);location.reload();
  }catch(e){toast('No se pudo conectar. Revisa la dirección y las reglas.')}
},
logout(){ask('¿Cerrar sesión?','En este celular tendrás que volver a poner el código.','Cerrar sesión',()=>{S=null;LS.d('ct_session');ST.screen='chooser';ST.stack=[];render()})}
};

function editTask(id){
  const t=id?get('routine/'+id):null;
  openSheet({title:t?'Editar tarea':'Nueva tarea',fields:[{k:'title',l:'Tarea',req:1,ph:'Ej: Limpiar cocina'},{k:'note',l:'Nota corta (opcional)',ph:'Ej: según necesidad'},{k:'days',l:'¿Qué días?',t:'days'}],vals:t?{title:t.title,note:t.note||'',days:t.days}:{days:'0123456'},
    onSave:v=>{if(!v.days){toast('Elige al menos un día');return}set('routine/'+(id||uid()),{title:v.title,note:v.note,days:v.days,o:t?t.o:Date.now()});closeSheet();render()},
    onDelete:t?()=>{set('routine/'+id,null);closeSheet();render()}:null,delLabel:'Eliminar tarea'});
}
function editSec(k,id){
  const C=SEC[k],cur=id?get(k+'/'+id):null;
  openSheet({title:cur?'Editar':C.add,fields:C.f,vals:cur||{},onSave:v=>{set(k+'/'+(id||uid()),{...(cur||{}),...v,o:cur?cur.o:Date.now()});closeSheet();render()},onDelete:cur?()=>{set(k+'/'+id,null);closeSheet();render()}:null});
}
function editPay(id){
  const cur=id?get('pagos/'+id):null;
  openSheet({title:cur?'Editar pago':'Anotar pago',fields:[{k:'type',l:'Tipo',t:'select',o:[['pago','Pago de sueldo'],['adelanto','Adelanto'],['descuento','Descuento'],['bono','Bono']]},{k:'amount',l:'Monto (Bs)',t:'number',req:1},{k:'date',l:'Fecha',t:'date',d:dkey()},{k:'note',l:'Nota (opcional)'}],vals:cur||{type:'pago',date:dkey()},onSave:v=>{set('pagos/'+(id||uid()),{type:v.type,amount:Number(v.amount)||0,date:v.date||dkey(),note:v.note,ts:cur?cur.ts:Date.now()});closeSheet();render()},onDelete:cur?()=>{set('pagos/'+id,null);closeSheet();render()}:null});
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){f(el,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form,fd=new FormData(f);
  if(k==='code'){const c=String(fd.get('code')||'').trim();if(!c)return;tryLogin(ST.role,c)}
  else if(k==='setup'){
    const fc=String(fd.get('fc')||'').trim();if(!/^\d{4,8}$/.test(fc)){ST.err='El código debe tener de 4 a 8 números.';return render()}
    seedAll(fc,randCode(),String(fd.get('nm')||'').trim());enter('family',fc);
  }
  else if(k==='shop'){const n=String(fd.get('n')||'').trim();if(!n)return;set('shop/'+uid(),{cat:ST.shop,name:n,done:false,o:Date.now()});render();const i=$('form[data-form=shop] input');if(i)i.focus()}
});
document.addEventListener('change',async e=>{
  if(e.target.matches('[data-photo]')&&e.target.files[0]){
    const d=await compress(e.target.files[0]);if(!d){toast('No se pudo leer la foto');return}
    SH.photo=d;$('#pvbox').innerHTML=`<img class="pv" src="${d}" alt="">`;
  }
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(ST.screen==='chooser')render()});
window.addEventListener('appinstalled',()=>{DP=null;render()});
window.addEventListener('online',()=>{flush().then(pull)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){flush().then(pull)}});
setInterval(()=>{if(!document.hidden&&ST.screen==='app')pull()},8000);

/* ============ ARRANQUE ============ */
async function boot(){
  render();
  const t0=Date.now();
  if(remote()){try{await Promise.race([flush().then(()=>pull()),new Promise(r=>setTimeout(r,3500))])}catch(e){}}
  const wait=Math.max(0,1100-(Date.now()-t0));
  await new Promise(r=>setTimeout(r,wait));
  if(S){
    const c=DB.config;
    const bad=(ST.synced||!remote())&&(!c||(S.role==='family'?S.code!==c.familyCode:S.code!==c.maidCode));
    if(bad){const was=S.role;S=null;LS.d('ct_session');ST.screen='chooser';ST.err=was==='maid'?'El código cambió. Pide el código nuevo a la familia.':'Entra con el código de la familia.'}
    else{ST.screen='app';ST.view='home';ST.root='home'}
  }else ST.screen='chooser';
  render();
}
boot();
})();
